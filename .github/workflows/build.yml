name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: client.cod
      # client.cod builds packs.cod into the same jar, so it needs packs.cod next to it
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/packs.cod
          path: packs.cod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: client.cod
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: client-cod
          path: client.cod/build/libs/*.jar
      # Every push to main publishes (or updates) a GitHub Release for the version in gradle.properties,
      # with the jar attached, so people can download it from the Releases page.
      - name: Read version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ver
        run: echo "v=$(grep '^mod_version=' client.cod/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: client.cod ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: |
            client.cod ${{ steps.ver.outputs.v }} for Minecraft 1.21.11 (Fabric). Needs Fabric API.
            Put the jar in your `mods` folder. See CHANGELOG.md for what's new.
          files: client.cod/build/libs/pvp-cod-*.jar
          make_latest: true
